  <style>
    #app { max-width: 960px; }

    .stat { background: var(--blanco); border: var(--borde); border-radius: 16px; padding: 14px 16px; box-shadow: 4px 4px 0 var(--tinta); }
    .stat b { display: block; font-family: "Bricolage Grotesque", sans-serif; font-size: 2.2rem; }
    .scroll { overflow-x: auto; }
    .id { font-family: ui-monospace, monospace; font-size: .8rem; color: var(--suave); }
  </style>
